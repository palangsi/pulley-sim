<!DOCTYPE html>
<html>
<head>
    <title>4:1 Winch Sim</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f0f0; }
        #sim-container { width: 400px; height: 400px; background: white; border: 2px solid #333; position: relative; margin: 20px; overflow: hidden; }
        #pulley-top { position: absolute; top: 20px; left: 150px; width: 100px; height: 20px; background: #666; }
        #load { position: absolute; bottom: 50px; left: 175px; width: 50px; height: 50px; background: #c0392b; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; transition: bottom 0.1s; }
        .rope { position: absolute; border-left: 2px dashed #333; height: 300px; top: 20px; }
        #controls { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <h1>4:1 Pulley Simulator</h1>
    <div id="sim-container">
        <div id="pulley-top"></div>
        <div class="rope" style="left: 175px;"></div>
        <div class="rope" style="left: 195px;"></div>
        <div class="rope" style="left: 215px;"></div>
        <div class="rope" style="left: 235px;"></div>
        <div id="load">100kg</div>
    </div>

    <div id="controls">
        <p>Pull the Rope (Distance): <input type="range" id="pullSlider" min="0" max="200" value="0"></p>
        <p>Effort Required: <strong>25kg</strong> (1/4 of load)</p>
        <p>Load Height: <span id="heightDisplay">0</span> units</p>
    </div>

    <script>
        const slider = document.getElementById('pullSlider');
        const load = document.getElementById('load');
        const heightDisplay = document.getElementById('heightDisplay');

        slider.addEventListener('input', () => {
            const pullDistance = slider.value;
            // The 4:1 Ratio: Load moves 1 unit for every 4 units of pull
            const liftDistance = pullDistance / 4;
            
            load.style.bottom = (50 + parseFloat(liftDistance)) + 'px';
            heightDisplay.innerText = liftDistance;
        });
    </script>
</body>
</html>
